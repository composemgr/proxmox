# nginx proxy address - http://172.17.0.1:8006

name: proxmox
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  # First node
  pve-1:
    image: ghcr.io/longqt-sea/proxmox-ve
    container_name: pve-1
    hostname: pve-1
    privileged: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ:-America/New_York}
    cgroup: host
    shm_size: 1g
    networks:
      dual_stack:
        ipv4_address: 10.0.99.1
        ipv6_address: fd00::1

    # Port mapping only required for Docker Desktop or LAN access from other machines.
    ports:
      - "172.17.0.1:2222:22"
      - "172.17.0.1:3128:3128"
      - "172.17.0.1:8006:8006"   # First node container port 8006 maps to host port 8006

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup               # Required for systemd init
      - /usr/lib/modules:/usr/lib/modules:ro        # Required for loading kernel modules
      - /sys/kernel/security:/sys/kernel/security   # Optional, needed for LXC
      - /var/lib/vz/dump:/var/lib/vz/dump           # Shared storage for VM/LXC backups
      - /var/lib/vz/template/iso:/var/lib/vz/template/iso # Shared storage for ISO files


